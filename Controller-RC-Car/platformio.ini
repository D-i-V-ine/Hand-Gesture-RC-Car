[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
lib_deps = 
	dunknowcoding/NiusIMU@^0.4.1
	arduino-libraries/Madgwick@^1.2.0
